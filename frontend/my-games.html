<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PlayTrade – My Games</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet" />

    <!-- Tailwind custom theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "vintage-brown": "#3b2f2f",
                        "vintage-cream": "#f9f5f0",
                        "vintage-accent": "#d97706",
                    },
                    fontFamily: {
                        playfair: ["Playfair Display", "serif"],
                        roboto: ["Roboto", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-vintage-cream text-vintage-brown font-roboto">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 w-full bg-vintage-brown text-vintage-cream py-4 shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="logo.png" alt="PlayTrade Logo" class="h-8 w-8 object-contain">
                <span class="text-lg font-playfair font-bold">PlayTrade</span>
            </a>
            <a href="profile.html"
                class="bg-vintage-accent hover:bg-amber-700 text-white font-medium py-2 px-6 rounded-full transition">
                My Profile
            </a>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <section class="bg-vintage-brown text-vintage-cream pt-32 pb-28">
        <div class="max-w-5xl mx-auto text-center px-4 translate-y-8">
            <!-- ICON -->
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-vintage-accent/20 flex items-center justify-center">
                <img src="logo.png" alt="Dice Logo" class="w-10 h-10 object-contain">
            </div>
            <h1 class="text-4xl font-playfair font-bold mb-4">My Games</h1>
            <p class="text-base opacity-80 max-w-xl mx-auto">
                View your listed games
            </p>
        </div>
    </section>

    <!-- FILTERS & SEARCH -->
    <section class="py-12 border-b border-vintage-brown/10">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">

                <!-- Search Bar -->
                <div class="w-full md:w-96 relative">
                    <input id="searchInput" type="text" placeholder="Search your games..."
                        class="w-full border rounded-xl px-4 py-3 pl-12 focus:ring-2 focus:ring-vintage-accent" />
                    <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-vintage-brown/40" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <!-- Filter & Sort -->
                <div class="flex gap-3 w-full md:w-auto">
                    <select id="conditionFilter"
                        class="flex-1 md:flex-none border rounded-xl px-4 py-3 focus:ring-2 focus:ring-vintage-accent cursor-pointer">
                        <option value="">All Conditions</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Acceptable">Acceptable</option>
                        <option value="Poor">Poor</option>
                    </select>

                    <select id="sortBy"
                        class="flex-1 md:flex-none border rounded-xl px-4 py-3 focus:ring-2 focus:ring-vintage-accent cursor-pointer">
                        <option value="name">Sort by Name</option>
                        <option value="condition">Sort by Condition</option>
                        <option value="players">Sort by Players</option>
                    </select>
                </div>
            </div>

            <!-- Quick Add Button -->
            <div class="mt-6 text-center">
                <a href="add-edit.html"
                    class="inline-flex items-center gap-2 bg-vintage-accent text-white px-6 py-3 rounded-full hover:bg-amber-700 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Add New Game
                </a>
            </div>
        </div>
    </section>

    <!-- GAMES GRID -->
    <section class="py-20">
        <div class="max-w-6xl mx-auto px-4">

            <!-- Game Count -->
            <div class="mb-6">
                <h2 class="text-2xl font-playfair font-bold">
                    <span id="gameCount">12</span> Games in Collection
                </h2>
            </div>

            <!-- Grid -->
            <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Games will be rendered here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-16 hidden">
                <svg class="w-24 h-24 mx-auto mb-4 text-vintage-brown/20" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <p class="text-vintage-brown/40 text-lg">No games found</p>
                <p class="text-sm text-vintage-brown/30 mt-1">Try adjusting your filters or add a new game!</p>
            </div>
        </div>
    </section>

    <script>
        // Mock game data
        const mockGames = [
            { name: "Catan", players: "3–4 players", condition: "Good", emoji: "🎲" },
            { name: "Dominion", players: "2–4 players", condition: "Like New", emoji: "👑" },
            { name: "Ticket to Ride", players: "2–5 players", condition: "Good", emoji: "🚂" },
            { name: "Carcassonne", players: "2–5 players", condition: "Good", emoji: "🗺️" },
            { name: "Risk", players: "2–6 players", condition: "Good", emoji: "⚔️" },
            { name: "Gloomhaven", players: "1–4 players", condition: "Like New", emoji: "🗡️" },
            { name: "7 Wonders Duel", players: "2 players", condition: "New", emoji: "🏛️" },
            { name: "Monopoly", players: "2–8 players", condition: "Acceptable", emoji: "💰" },
            { name: "Memory", players: "2–6 players", condition: "Good", emoji: "🧠" },
            { name: "The Search for Planet X", players: "1–4 players", condition: "Like New", emoji: "🔴" },
            { name: "Scrabble", players: "2–4 players", condition: "Good", emoji: "📝" },
            { name: "Ludo", players: "2–4 players", condition: "Acceptable", emoji: "🎯" }
        ];

        let filteredGames = [...mockGames];

        const searchInput = document.getElementById("searchInput");
        const conditionFilter = document.getElementById("conditionFilter");
        const sortBy = document.getElementById("sortBy");
        const gamesGrid = document.getElementById("gamesGrid");
        const emptyState = document.getElementById("emptyState");
        const gameCount = document.getElementById("gameCount");

        // Search functionality
        searchInput.addEventListener("input", filterAndRender);
        conditionFilter.addEventListener("change", filterAndRender);
        sortBy.addEventListener("change", filterAndRender);

        function filterAndRender() {
            const searchTerm = searchInput.value.toLowerCase();
            const condition = conditionFilter.value;

            // Filter
            filteredGames = mockGames.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(searchTerm);
                const matchesCondition = !condition || game.condition === condition;
                return matchesSearch && matchesCondition;
            });

            // Sort
            const sortValue = sortBy.value;
            if (sortValue === "name") {
                filteredGames.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortValue === "condition") {
                const conditionOrder = { "New": 1, "Like New": 2, "Good": 3, "Acceptable": 4, "Poor": 5 };
                filteredGames.sort((a, b) => conditionOrder[a.condition] - conditionOrder[b.condition]);
            } else if (sortValue === "players") {
                filteredGames.sort((a, b) => {
                    const aNum = parseInt(a.players.match(/\d+/)[0]);
                    const bNum = parseInt(b.players.match(/\d+/)[0]);
                    return aNum - bNum;
                });
            }

            renderGames();
        }

        function renderGames() {
            gameCount.textContent = filteredGames.length;

            if (filteredGames.length === 0) {
                gamesGrid.classList.add("hidden");
                emptyState.classList.remove("hidden");
                return;
            }

            gamesGrid.classList.remove("hidden");
            emptyState.classList.add("hidden");
            gamesGrid.innerHTML = "";

            filteredGames.forEach(game => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl shadow-md border border-vintage-brown/10 p-6 hover:-translate-y-2 hover:shadow-lg transition cursor-pointer group";

                card.innerHTML = `
                    <div class="h-40 bg-vintage-accent/20 rounded-xl mb-4 flex items-center justify-center text-5xl group-hover:scale-110 transition">
                        ${game.emoji}
                    </div>
                    <h3 class="text-lg font-medium mb-1">${game.name}</h3>
                    <p class="text-sm opacity-80 mb-3">${game.players}</p>
                    <div class="flex items-center justify-between">
                        <span class="text-xs px-3 py-1 rounded-full ${getConditionBadge(game.condition)}">
                            ${game.condition}
                        </span>
                        <button class="text-vintage-accent hover:text-amber-700 text-sm font-medium">
                            Edit
                        </button>
                    </div>
                `;

                card.onclick = (e) => {
                    if (!e.target.closest("button")) {
                        // View game details
                        console.log("View game:", game.name);
                    }
                };

                const editBtn = card.querySelector("button");
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    // Redirect to edit page
                    window.location.href = 'add-edit.html';
                };

                gamesGrid.appendChild(card);
            });
        }

        function getConditionBadge(condition) {
            const badges = {
                "New": "bg-green-100 text-green-700",
                "Like New": "bg-emerald-100 text-emerald-700",
                "Good": "bg-blue-100 text-blue-700",
                "Acceptable": "bg-amber-100 text-amber-700",
                "Poor": "bg-red-100 text-red-700"
            };
            return badges[condition] || "bg-gray-100 text-gray-700";
        }

        // Initialize
        renderGames();
    </script>

</body>

</html>
