<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PlayTrade – Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet" />

    <!-- Tailwind custom theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "vintage-brown": "#3b2f2f",
                        "vintage-cream": "#f9f5f0",
                        "vintage-accent": "#d97706",
                    },
                    fontFamily: {
                        playfair: ["Playfair Display", "serif"],
                        roboto: ["Roboto", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-vintage-cream text-vintage-brown font-roboto pt-24">
    <!-- HEADER -->
    <header class="fixed top-0 left-0 w-full bg-vintage-brown text-vintage-cream py-4 shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <!-- Logo -->
            <a href="index.html" class="flex items-center space-x-2">
                <img src="logo.png" alt="PlayTrade Logo" class="h-8 w-8 object-contain">
                <span class="text-lg font-playfair font-bold">
                    PlayTrade
                </span>
            </a>

            <!-- Auth / User -->
            <a href="#"
                class="bg-vintage-accent hover:bg-amber-700 text-white font-medium py-2 px-6 rounded-full transition">
                Login / Sign Up
            </a>
        </div>
    </header>

    <!-- PROFILE HEADER -->
    <section class="bg-vintage-brown text-vintage-cream py-28 relative -mt-16">
        <div class="max-w-5xl mx-auto text-center px-4">
            <!-- AVATAR -->
            <div
                class="w-32 h-32 mx-auto rounded-full bg-vintage-accent/20 flex items-center justify-center text-vintage-accent text-4xl font-bold mb-6">
                LH
            </div>

            <!-- NAME & BIO -->
            <h1 class="text-3xl font-playfair font-bold mt-4">
                Luka Hacek
            </h1>
            <p class="text-base opacity-80 mt-3 mb-4">
                Board game collector & trader
            </p>

            <!-- EDIT PROFILE BUTTON -->
            <a href="editProfile.html"
                class="inline-flex items-center gap-2 bg-vintage-accent/20 text-vintage-cream border border-vintage-accent/40 px-6 py-2 rounded-full hover:bg-vintage-accent/30 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
                Edit Profile
            </a>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section class="py-20">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-2xl font-playfair font-bold text-center mb-12">
                My Dashboard
            </h2>

            <!-- RESPONSIVE GRID -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-8">

                <!-- My Games -->
                <a href="my-games.html"
                    class="bg-white py-6 px-6 rounded-2xl shadow-md border border-vintage-brown/10 transition-transform transform hover:-translate-y-2 hover:shadow-lg cursor-pointer text-center">
                    <div
                        class="w-16 h-16 mx-auto mb-4 rounded-full bg-vintage-accent/20 flex items-center justify-center">
                        <img src="logo.png" alt="Dice Logo" class="w-10 h-10 object-contain">
                    </div>
                    <h3 class="text-xl font-medium mb-1">My Games</h3>
                    <p class="text-base opacity-80">
                        View your listed games
                    </p>
                </a>

                <!-- My Trades (Combined with Offers) -->
                <a href="myTrades.html"
                    class="bg-white py-6 px-6 rounded-2xl shadow-md border border-vintage-brown/10 transition-transform transform hover:-translate-y-2 hover:shadow-lg cursor-pointer text-center">
                    <div
                        class="w-16 h-16 mx-auto mb-4 rounded-full bg-vintage-accent/20 flex items-center justify-center text-vintage-accent text-3xl">
                        🔄
                    </div>
                    <h3 class="text-xl font-medium mb-1">My Trades</h3>
                    <p class="text-base opacity-80">
                        Current and past trade offers
                    </p>
                </a>

                <!-- Add / Edit Game -->
                <a href="add-edit.html"
                    class="bg-white py-6 px-6 rounded-2xl shadow-md border border-vintage-brown/10 transition-transform transform hover:-translate-y-2 hover:shadow-lg cursor-pointer text-center">
                    <div
                        class="w-16 h-16 mx-auto mb-4 rounded-full bg-vintage-accent/20 flex items-center justify-center text-vintage-accent text-3xl">
                        ✏️
                    </div>
                    <h3 class="text-xl font-medium mb-1">Add / Edit Game</h3>
                    <p class="text-base opacity-80">
                        Manage your listings
                    </p>
                </a>

                <!-- Wishlist -->
                <a href="wishlist.html"
                    class="bg-white py-6 px-6 rounded-2xl shadow-md border border-vintage-brown/10 transition-transform transform hover:-translate-y-2 hover:shadow-lg cursor-pointer text-center">
                    <div
                        class="w-16 h-16 mx-auto mb-4 rounded-full bg-vintage-accent/20 flex items-center justify-center text-vintage-accent text-3xl">
                        ❤️
                    </div>
                    <h3 class="text-xl font-medium mb-1">Wishlist</h3>
                    <p class="text-base opacity-80">
                        Games you want to trade for
                    </p>
                </a>
            </div>
        </div>
    </section>
</body>

</html>
