<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>PlayTrade – Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet" />

    <!-- Tailwind custom theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "vintage-brown": "#3b2f2f",
                        "vintage-cream": "#f9f5f0",
                        "vintage-accent": "#d97706",
                        "success-green": "#22c55e"
                    },
                    fontFamily: {
                        playfair: ["Playfair Display", "serif"],
                        roboto: ["Roboto", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-vintage-cream text-vintage-brown font-roboto">

    <!-- SUCCESS POPUP -->
    <div id="successPopup"
        class="fixed top-24 right-6 bg-success-green text-white px-6 py-4 rounded-xl shadow-2xl hidden z-[60]">
        Profile updated successfully ✔
    </div>

    <!-- HEADER -->
    <header class="fixed top-0 left-0 w-full bg-vintage-brown text-vintage-cream py-4 shadow-lg z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="logo.png" alt="PlayTrade Logo" class="h-8 w-8 object-contain">
                <span class="text-lg font-playfair font-bold">PlayTrade</span>
            </a>
            <a href="profile.html"
                class="bg-vintage-accent hover:bg-amber-700 text-white font-medium py-2 px-6 rounded-full transition">
                My Profile
            </a>
        </div>
    </header>

    <!-- PAGE HEADER -->
    <section class="bg-vintage-brown text-vintage-cream pt-32 pb-28">
        <div class="max-w-5xl mx-auto text-center px-4 translate-y-8">
            <h1 class="text-4xl font-playfair font-bold mb-4">Edit Profile</h1>
            <p class="text-base opacity-80">
                Update your profile information
            </p>
        </div>
    </section>

    <!-- EDIT PROFILE FORM -->
    <section class="py-20">
        <div class="max-w-2xl mx-auto px-4">
            <form id="profileForm" class="bg-white rounded-2xl shadow-md border border-vintage-brown/10 p-8">

                <!-- PROFILE PICTURE -->
                <div class="mb-8 text-center">
                    <label class="block text-sm font-medium mb-4 text-left">Profile Picture</label>

                    <!-- Avatar Preview -->
                    <div class="relative inline-block">
                        <div id="avatarPreview"
                            class="w-32 h-32 mx-auto rounded-full bg-vintage-accent/20 flex items-center justify-center text-vintage-accent text-4xl font-bold mb-4 overflow-hidden">
                            <span id="avatarInitials">LH</span>
                            <img id="avatarImage" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                        </div>

                        <!-- Upload Button -->
                        <button type="button" id="uploadBtn"
                            class="absolute bottom-2 right-2 bg-vintage-accent text-white p-2 rounded-full shadow-lg hover:bg-amber-700 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>

                    <input type="file" id="avatarUpload" accept="image/*" class="hidden" />

                    <button type="button" id="removeAvatarBtn"
                        class="text-red-500 text-sm font-medium hover:text-red-700 mt-2 hidden">
                        Remove Picture
                    </button>
                </div>

                <!-- USERNAME -->
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Username</label>
                    <input id="username" type="text"
                        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-vintage-accent"
                        placeholder="Enter your username" value="Luka Hacek" required />
                </div>

                <!-- BIO -->
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Bio</label>
                    <textarea id="bio"
                        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-vintage-accent resize-none"
                        rows="3" placeholder="Tell us about yourself...">Board game collector & trader</textarea>
                </div>

                <!-- LOCATION -->
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Location</label>
                    <input id="location" type="text"
                        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-vintage-accent"
                        placeholder="e.g. Zagreb, Croatia" value="Zagreb, Croatia" required />
                    <p class="text-xs text-vintage-brown/60 mt-2">
                        🌍 Your location helps match you with nearby traders
                    </p>
                </div>

                <!-- BUTTONS -->
                <div class="flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-vintage-accent text-white py-3 rounded-full hover:bg-amber-700 transition">
                        Save Changes
                    </button>
                    <a href="profile.html"
                        class="px-8 bg-gray-300 text-vintage-brown py-3 rounded-full hover:bg-gray-400 transition text-center">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </section>

    <script>
        const form = document.getElementById("profileForm");
        const popup = document.getElementById("successPopup");
        const avatarUpload = document.getElementById("avatarUpload");
        const uploadBtn = document.getElementById("uploadBtn");
        const removeAvatarBtn = document.getElementById("removeAvatarBtn");
        const avatarPreview = document.getElementById("avatarPreview");
        const avatarInitials = document.getElementById("avatarInitials");
        const avatarImage = document.getElementById("avatarImage");
        const usernameInput = document.getElementById("username");

        let selectedAvatar = null;

        // Upload avatar
        uploadBtn.addEventListener("click", () => {
            avatarUpload.click();
        });

        avatarUpload.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedAvatar = e.target.result;
                    avatarImage.src = selectedAvatar;
                    avatarImage.classList.remove("hidden");
                    avatarInitials.classList.add("hidden");
                    removeAvatarBtn.classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
        });

        // Remove avatar
        removeAvatarBtn.addEventListener("click", () => {
            selectedAvatar = null;
            avatarImage.classList.add("hidden");
            avatarInitials.classList.remove("hidden");
            removeAvatarBtn.classList.add("hidden");
            avatarUpload.value = "";
            updateInitials();
        });

        // Update initials when username changes
        usernameInput.addEventListener("input", () => {
            if (!selectedAvatar) {
                updateInitials();
            }
        });

        function updateInitials() {
            const name = usernameInput.value.trim();
            if (name) {
                const parts = name.split(" ");
                const initials = parts.length > 1
                    ? parts[0][0] + parts[parts.length - 1][0]
                    : parts[0].substring(0, 2);
                avatarInitials.textContent = initials.toUpperCase();
            } else {
                avatarInitials.textContent = "?";
            }
        }

        // Form submit
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const profileData = {
                username: usernameInput.value,
                bio: document.getElementById("bio").value,
                location: document.getElementById("location").value,
                avatar: selectedAvatar
            };

            console.log("Profile data:", profileData);

            // Show success popup
            popup.classList.remove("hidden");
            setTimeout(() => {
                popup.classList.add("hidden");
                // Redirect to profile (optional)
                // window.location.href = "profile.html";
            }, 2500);
        });
    </script>

</body>

</html>
